<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050705" />
  <meta name="description" content="Clever Waste — Think Before You Trash It. Riduci lo spreco alimentare e valorizza le eccedenze." />
  <title>Clever Waste — Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="stage" aria-label="Clever Waste web app">
    <div class="stage-brand" aria-hidden="true"><span class="brand-mark">✳</span><span>CLEVER <b>WASTE.</b></span></div>
    <section class="device" aria-label="iPhone virtuale con Clever Waste">
      <div class="device-side side-left"></div><div class="device-side side-right"></div>
      <div class="device-screen">
        <div class="status-bar"><span id="clock">9:41</span><span class="dynamic-island"></span><span class="status-icons"><span>▮▮▮</span><span>⌁</span><span class="battery"><i></i></span></span></div>
        <header id="app-header" class="app-header"></header>
        <section id="app-content" class="app-content" tabindex="0" aria-live="polite"></section>
        <nav id="bottom-nav" class="bottom-nav" aria-label="Navigazione principale"></nav>
        <div class="home-indicator"><i></i></div>
      </div>
    </section>
    <div class="stage-caption" aria-hidden="true">THINK BEFORE YOU TRASH IT <span>•</span> MENO SPRECHI, PIÙ VALORE</div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="./app.js" defer></script>
</body>
</html>
